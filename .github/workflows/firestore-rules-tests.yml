name: Firestore rules tests

on:
  push:
    branches:
      - main
      - security/firebase-auth-hardening
    paths:
      - "gurupro_remote/firestore.rules"
      - "gurupro_remote/firebase.json"
      - "gurupro_remote/package.json"
      - "gurupro_remote/package-lock.json"
      - "gurupro_remote/tests/**"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    paths:
      - "gurupro_remote/firestore.rules"
      - "gurupro_remote/firebase.json"
      - "gurupro_remote/package.json"
      - "gurupro_remote/package-lock.json"
      - "gurupro_remote/tests/**"
      - ".github/workflows/firestore-rules-tests.yml"

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gurupro_remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules
