name: Python security tests

on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "main.py"
      - "controllers/**"
      - "ui/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "main.py"
      - "controllers/**"
      - "ui/**"
      - ".github/workflows/python-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile desktop Python source
        run: python -m compileall -q backend controllers main.py
      - name: Run security and password tests
        run: python -m unittest discover -s tests -v
